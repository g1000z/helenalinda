<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O casal do ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e1a33; --night-2:#1b2c52; --glow:#f3b6a8; --rose:#e8887a;
    --cream:#fff6ec; --gold:#f2d7a0; --ink:#2a1d38; --muted:#b9c4de;
    --card:#fffdfb;
    --serif:'Playfair Display', Georgia, serif;
    --sans:'DM Sans', -apple-system, 'Segoe UI', sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    min-height:100%;
    background:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 46% 22%, #ffe9d6 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 10%, #fff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 80% 20%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 91% 7%, #ffe9d6 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 44%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 94% 46%, #fff 50%, transparent 51%),
      radial-gradient(ellipse 80% 45% at 50% 100%, rgba(232,136,122,0.35), transparent 70%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    background-attachment: fixed;
    font-family: var(--sans); color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    padding: 40px 14px;
  }
  .stage{ width:100%; max-width:420px; text-align:center; }

  h1{
    font-family: var(--serif); font-style:italic; font-weight:500;
    font-size:1.55rem; line-height:1.25; margin-bottom:10px; color: var(--cream);
  }
  .sub{ font-size:0.85rem; color:var(--muted); margin-bottom:24px; }

  .btn{
    font-family: var(--sans); font-weight:600; font-size:0.95rem;
    color:#fff; background: linear-gradient(135deg, #f0a090, var(--rose));
    border:none; padding:15px 24px; border-radius:999px; cursor:pointer; width:100%;
    box-shadow: 0 10px 24px -10px rgba(232,136,122,0.8);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(232,136,122,0.9); }

  .camera-scene{ margin-top:22px; position:relative; }
  .camera-body{ position:relative; z-index:2; display:block; margin:0 auto; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.45)); }

  .flash{ position:fixed; inset:0; background:#fff7ea; opacity:0; pointer-events:none; z-index:10; }
  .flash.go{ animation: flash 0.6s ease-out; }
  @keyframes flash{ 0%{opacity:0.95;} 100%{opacity:0;} }

  .photo-slot{
    position:relative; z-index:1; margin-top:-6px;
    overflow:hidden; max-height:0; transition: max-height 0.9s cubic-bezier(.3,.9,.3,1);
  }
  .photo-slot.show{ max-height:420px; }

  .pair{ display:flex; gap:10px; justify-content:center; padding:14px 2px 6px; }

  .photo{
    flex:1; min-width:0; background: var(--card); border-radius:4px; padding:9px 9px 14px;
    box-shadow: 0 16px 34px -14px rgba(0,0,0,0.5);
    transform: translateY(-130%) rotate(0deg); opacity:0;
    transition: transform 0.8s cubic-bezier(.3,.9,.3,1), opacity 0.3s ease;
  }
  .photo-slot.show .photo{ opacity:1; }
  .photo-slot.show .photo.a{ transform: translateY(0) rotate(-3deg); transition-delay:0.1s; }
  .photo-slot.show .photo.b{ transform: translateY(0) rotate(3deg);  transition-delay:0.55s; }

  .photo-window{
    aspect-ratio: 3/4; border-radius:3px; overflow:hidden;
    background: repeating-linear-gradient(135deg, #f1e4f7, #f1e4f7 10px, #e9d6f2 10px, #e9d6f2 20px);
    border: 1px solid #d8c4ea;
  }
  .photo-window img{ width:100%; height:100%; object-fit:cover; display:block; }

  .photo-caption{
    margin-top:10px; font-family:'Cormorant Garamond', Georgia, serif; font-style:italic;
    font-size:0.98rem; line-height:1.2; color: var(--ink); text-align:center;
  }

  .verdict{
    margin-top:20px; font-family: var(--serif); font-style:italic; font-size:1.2rem;
    color: var(--gold);
    opacity:0; transition: opacity 0.8s ease 1.6s;
  }
  .photo-slot.show ~ .verdict{ opacity:1; }
</style>
</head>
<body>

<div class="stage">
  <h1>Entre tantas pessoas no mundo, eu encontrei você</h1>
  <p class="sub">toque no botão e veja o resultado</p>

  <button class="btn" id="btn-camera">revelar o casal mais feliz do ano</button>

  <div class="camera-scene">
    <svg class="camera-body" width="200" height="130" viewBox="0 0 200 130">
      <defs>
        <linearGradient id="camBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff6ec"/><stop offset="100%" stop-color="#ecd5bf"/>
        </linearGradient>
        <linearGradient id="camBand" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#e8887a"/><stop offset="100%" stop-color="#f3b6a8"/>
        </linearGradient>
        <radialGradient id="lensGlass" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffe9d6"/><stop offset="45%" stop-color="#6c7fb0"/><stop offset="100%" stop-color="#121b36"/>
        </radialGradient>
      </defs>
      <rect x="8" y="34" width="184" height="86" rx="16" fill="url(#camBody)"/>
      <rect x="8" y="34" width="184" height="22" rx="16" fill="url(#camBand)"/>
      <rect x="8" y="46" width="184" height="10" fill="url(#camBand)"/>
      <rect x="22" y="62" width="34" height="18" rx="4" fill="#fff" stroke="#e3c9ae" stroke-width="1.5"/>
      <rect x="26" y="66" width="26" height="10" rx="2" fill="#fff0c4"/>
      <circle cx="166" cy="72" r="10" fill="#e8887a"/>
      <circle cx="166" cy="72" r="6.5" fill="#f3b6a8"/>
      <circle cx="104" cy="82" r="36" fill="#3a3350"/>
      <circle cx="104" cy="82" r="31" fill="#f2d7a0"/>
      <circle cx="104" cy="82" r="26" fill="url(#lensGlass)"/>
      <circle cx="94" cy="72" r="6" fill="#fff" opacity="0.55"/>
      <circle cx="113" cy="91" r="2.5" fill="#fff" opacity="0.35"/>
      <rect x="64" y="104" width="80" height="6" rx="3" fill="#2a1d38" opacity="0.18"/>
    </svg>

    <div class="photo-slot" id="photo-slot">
      <div class="pair">
        <div class="photo a">
          <div class="photo-window"><img id="foto1" alt=""></div>
          <p class="photo-caption">Heleninha do princesinho</p>
        </div>
        <div class="photo b">
          <div class="photo-window"><img id="foto2" alt=""></div>
          <p class="photo-caption">Princesinho da Heleninha</p>
        </div>
      </div>
    </div>

    <p class="verdict">o casal mais feliz do ano 💜</p>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
(function(){
  const btn = document.getElementById('btn-camera');
  const slot = document.getElementById('photo-slot');
  const flash = document.getElementById('flash');

  btn.addEventListener('click', () => {
    btn.style.display = 'none';
    flash.classList.add('go');

    // Troque pelos nomes das suas fotos. Elas só carregam depois do clique.
    document.getElementById('foto1').src = 'foto-dela.jpg';
    document.getElementById('IMG_20260817_145912_684.jpg').src = 'foto-dele.jpg';

    setTimeout(() => slot.classList.add('show'), 250);
  });
})();
</script>
</body>
</html>

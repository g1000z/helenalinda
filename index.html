<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duas surpresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2d2140;
    --bg-soft:#3a2c52;
    --card:#fffdfb;
    --accent:#c9a24b;
    --accent-soft:#e7cf9c;
    --ink:#2a1d38;
    --muted:#c9bcdb;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Inter', -apple-system, 'Segoe UI', sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    min-height:100%;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-soft) 100%);
    font-family: var(--sans);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    padding: 48px 22px;
  }

  .stage{ width:100%; max-width:380px; text-align:center; }

  h1{
    font-family: var(--serif); font-style:italic; font-weight:500;
    font-size:1.5rem; margin-bottom:10px; color:#fff;
  }
  .sub{ font-size:0.85rem; color:var(--muted); margin-bottom:36px; }

  .choices{
    display:flex; flex-direction:column; gap:12px;
  }
  .btn{
    font-family: var(--sans); font-weight:600; font-size:0.92rem;
    color: var(--ink); background: var(--accent-soft);
    border:none; padding: 15px 24px; border-radius: 14px; cursor:pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    width:100%;
  }
  .btn:hover{ background: var(--accent); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }

  .hidden{ display:none !important; }

  .letter{
    margin-top:8px;
    background: var(--card);
    border-radius: 18px;
    padding: 32px 26px;
    text-align:center;
    box-shadow: 0 18px 40px -16px rgba(0,0,0,0.45);
    opacity:0; transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  .letter .tag{
    display:block;
    font-family: var(--sans); font-weight:600; font-size:0.68rem; letter-spacing:0.08em;
    text-transform:uppercase; color: #9a7a46; margin-bottom:14px;
  }
  .letter p{
    font-family: var(--serif); font-style:italic; font-size:1.22rem;
    line-height:1.6; color: var(--ink);
  }

  .next-wrap{ margin-top:22px; }
  .next-wrap p{
    font-family: var(--sans); font-size:0.8rem; color:var(--muted); margin-bottom:12px;
  }

  .finale{
    margin-top:26px;
    font-family: var(--serif); font-style:italic; font-size:1.05rem;
    color: var(--accent-soft);
    opacity:0; transform: translateY(8px);
  }
  .finale.show{ animation: rise 0.5s ease forwards; }
</style>
</head>
<body>

<div class="stage">
  <h1>Duas pequenas surpresas</h1>
  <p class="sub">escolha uma para começar</p>

  <div class="choices" id="choices">
    <button class="btn" data-key="fox">A raposa</button>
    <button class="btn" data-key="letter">A carta</button>
  </div>

  <div id="message-slot"></div>

  <div class="next-wrap hidden" id="next-wrap">
    <p>ir para outra surpresa</p>
    <button class="btn" id="btn-next"></button>
  </div>

  <p class="finale" id="finale">isso é só uma pequena parte do quanto eu gosto de você</p>
  <a class="btn hidden" id="btn-video" href="https://youtu.be/ElYqfOSUm7s?t=80&si=ilU8TkyTfo-Bmc4N" target="_blank" rel="noopener" style="display:block; text-decoration:none; margin-top:16px;">mais uma coisa</a>
</div>

<script>
(function(){
  const messages = {
    fox: {
      label: "o pequeno príncipe",
      buttonLabel: "A raposa",
      text: "Cativar não é prender, é construir um laço que mais ninguém tem com aquela pessoa"
    },
    letter: {
      label: "diário de uma paixão",
      buttonLabel: "A carta",
      text: "Amor de verdade não é um momento, é a soma de todos os dias em que se escolhe continuar"
    }
  };

  const choices = document.getElementById('choices');
  const messageSlot = document.getElementById('message-slot');
  const nextWrap = document.getElementById('next-wrap');
  const btnNext = document.getElementById('btn-next');
  const finale = document.getElementById('finale');

  let openedCount = 0;

  function renderMessage(key){
    const m = messages[key];
    messageSlot.innerHTML = `
      <div class="letter">
        <span class="tag">${m.label}</span>
        <p>${m.text}</p>
      </div>`;
  }

  function openMessage(key){
    openedCount++;
    choices.classList.add('hidden');
    nextWrap.classList.add('hidden');
    renderMessage(key);

    if(openedCount === 1){
      const otherKey = key === 'fox' ? 'letter' : 'fox';
      setTimeout(() => {
        btnNext.textContent = messages[otherKey].buttonLabel;
        btnNext.onclick = () => openMessage(otherKey);
        nextWrap.classList.remove('hidden');
      }, 600);
    } else {
      setTimeout(() => {
        finale.classList.add('show');
        document.getElementById('btn-video').classList.remove('hidden');
      }, 600);
    }
  }

  choices.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('click', () => openMessage(b.dataset.key));
  });
})();
</script>
</body>
</html>

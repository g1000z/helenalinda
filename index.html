<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eu te amo</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#fde7ee; --bg2:#fff4f7; --ink:#4a1230; --muted:#8a5a74; --accent:#c2185b; --soft:#f6c6d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#2b0d1d; --bg2:#45142e; --ink:#ffe6ee; --muted:#d9a9bf; --accent:#ff8fb1; --soft:#5a2342;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#2b0d1d; --bg2:#45142e; --ink:#ffe6ee; --muted:#d9a9bf; --accent:#ff8fb1; --soft:#5a2342;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 35%,var(--bg2),var(--bg) 75%) fixed;color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span{position:absolute;bottom:-10%;color:var(--accent);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.28}85%{opacity:.2}100%{transform:translateY(-115vh);opacity:0}}
.stage{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:32px 22px}
.phrase{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2.4rem,12vw,5.6rem);line-height:1.08;margin:0;color:var(--accent);overflow-wrap:anywhere;max-width:100%;transition:opacity .2s ease}
.lang{margin:0;font-size:1.15rem;min-height:3.2em;transition:opacity .2s ease}
.lang strong{font-weight:600}
.lang span{display:block;color:var(--muted)}
.out{opacity:0}
.quote{margin:0;max-width:34ch;font-family:"Young Serif",Georgia,serif;font-size:1.15rem;line-height:1.4}
.quote footer{font-family:"Figtree",system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:600;cursor:pointer;text-decoration:none;border:2px solid var(--accent);background:var(--accent);color:var(--bg);padding:10px 22px;border-radius:999px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hearts{display:none}.phrase,.lang{transition:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="stage">
  <section>
    <h1 class="phrase" id="phrase" lang="pt">Eu te amo</h1>
    <p class="lang" id="lang"><strong>Português</strong></p>
  </section>
  <blockquote class="quote">
    <p>Isso é para te lembrar do quanto eu amo você, minha princesinha, você é o meu mundo.</p>
  </blockquote>
  <div class="actions">
    <button class="btn ghost" id="pause">Parar</button>
  </div>
</main>

const first=["Português","Alemão","Inglês"];
const seen=new Set();
const D=[...first.map(n=>L.find(r=>r[0]===n)),...L.filter(r=>!first.includes(r[0]))]
  .filter(r=>{const k=r[1].toLowerCase();if(seen.has(k))return false;seen.add(k);return true});

const $=id=>document.getElementById(id);
const phrase=$("phrase"),lang=$("lang"),pauseBtn=$("pause");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=0,timer=null,paused=false;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function show(i){
  cur=i;
  const [name,txt,pron,code]=D[i];
  phrase.classList.add("out");lang.classList.add("out");
  setTimeout(()=>{
    phrase.textContent=txt;
    phrase.lang=code.split("-")[0];
    phrase.dir=/^(ar|fa|ur|he|yi|ps)/.test(code)?"rtl":"auto";
    lang.innerHTML="<strong>"+esc(name)+"</strong>"+(pron?"<span>"+esc(pron)+"</span>":"");
    phrase.classList.remove("out");lang.classList.remove("out");
  },reduce?0:200);
}
function start(){clearInterval(timer);if(!paused)timer=setInterval(()=>show((cur+1)%D.length),2000)}
pauseBtn.addEventListener("click",()=>{paused=!paused;pauseBtn.textContent=paused?"Continuar":"Parar";start()});

const hs=$("hearts");
for(let i=0;i<16;i++){
  const s=document.createElement("span");
  s.textContent="♥";
  s.style.left=(Math.random()*100)+"%";
  s.style.fontSize=(14+Math.random()*26)+"px";
  s.style.animationDuration=(9+Math.random()*9)+"s";
  s.style.animationDelay=(-Math.random()*14)+"s";
  hs.appendChild(s);
}
start();
</script>

</html>

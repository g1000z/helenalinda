<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Heleninha ♥</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#050505;
    --bg-2:#000000;
    --pink:#ffb6c1;
    --pink-soft:#ffd7dd;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background:var(--bg-2);
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:radial-gradient(circle at 50% 42%, #120a0c 0%, var(--bg-1) 55%, var(--bg-2) 100%);
  }
  canvas{
    display:block;
    cursor:pointer;
    transition:transform 2.4s ease-in-out;
  }
  canvas.pulse{
    animation:beat 2.8s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
  }
  #surprise-wrap{
    position:fixed;
    left:0; right:0; bottom:6%;
    display:flex; justify-content:center;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .9s ease, transform .9s ease;
    pointer-events:none;
  }
  #surprise-wrap.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #surprise-btn{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:.5px;
    color:var(--pink-soft);
    background:none;
    border:none;
    padding:8px 4px;
    cursor:pointer;
    opacity:.75;
    transition:opacity .25s ease;
  }
  #surprise-btn:hover,
  #surprise-btn:focus-visible{
    opacity:1;
    text-decoration:underline;
    text-underline-offset:4px;
  }
  @media (prefers-reduced-motion: reduce){
    canvas.pulse{ animation:none; }
    canvas{ transition:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Coracao feito de texto repetido"></canvas>
</div>
<div id="surprise-wrap">
  <button id="surprise-btn" type="button">Aperte aqui</button>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var surpriseWrap = document.getElementById('surprise-wrap');
  var DPR = Math.min(window.devicePixelRatio || 1, 3);

  var PHRASE = "Heleninha";
  var SCALES = [11, 12, 13, 14, 15, 16];
  var STEPS = 120;
  var DRAW_SECONDS = 12; // total time to fully draw the heart

  // ---- build the heart-curve points (classic parametric heart) ----
  var points = [];
  SCALES.forEach(function(scale){
    for (var i = 0; i < STEPS; i++){
      var angle = i * (Math.PI * 2) / STEPS;
      var x = 16 * Math.pow(Math.sin(angle), 3) * scale;
      var y = (13*Math.cos(angle) - 5*Math.cos(2*angle) - 2*Math.cos(3*angle) - Math.cos(4*angle)) * scale;
      points.push({ x: x, y: y });
    }
  });

  var bbox = (function(){
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    points.forEach(function(p){
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });
    return {minX:minX,maxX:maxX,minY:minY,maxY:maxY};
  })();

  var cssW, cssH, pixelScale, cx, cy, fontSize;

  function layout(){
    cssW = Math.min(window.innerWidth * 0.94, 900);
    cssH = Math.min(window.innerHeight * 0.86, 900);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var bw = bbox.maxX - bbox.minX;
    var bh = bbox.maxY - bbox.minY;
    var pad = 0.86;
    pixelScale = Math.min(cssW/bw, cssH/bh) * pad;
    cx = cssW/2 - (bbox.minX + bbox.maxX)/2 * pixelScale;
    cy = cssH/2 + (bbox.minY + bbox.maxY)/2 * pixelScale;
    fontSize = Math.max(7, Math.min(11, cssW/58));
  }
  layout();

  function toCanvas(p){
    return { x: cx + p.x*pixelScale, y: cy - p.y*pixelScale };
  }

  var pink = getComputedStyle(document.documentElement).getPropertyValue('--pink').trim();
  var animId = null;
  var startTime = null;
  var drawnCount = 0;

  function easeOutQuad(t){ return 1 - (1-t)*(1-t); }

  function drawUpTo(count){
    for (; drawnCount < count; drawnCount++){
      var c = toCanvas(points[drawnCount]);
      ctx.fillText(PHRASE, c.x, c.y);
    }
  }

  function frame(ts){
    if (startTime === null) startTime = ts;
    var t = Math.min(1, (ts - startTime) / (DRAW_SECONDS * 1000));
    var eased = easeOutQuad(t);
    var target = Math.floor(eased * points.length);
    drawUpTo(target);
    if (t < 1){
      animId = requestAnimationFrame(frame);
    } else {
      drawUpTo(points.length);
      onDone();
    }
  }

  function onDone(){
    canvas.classList.add('pulse');
    surpriseWrap.classList.add('show');
  }

  function start(){
    if (animId) cancelAnimationFrame(animId);
    canvas.classList.remove('pulse');
    surpriseWrap.classList.remove('show');
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = pink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "600 " + fontSize + "px 'Poppins', sans-serif";
    ctx.shadowColor = 'rgba(255,182,193,0.55)';
    ctx.shadowBlur = fontSize * 0.6;
    startTime = null;
    drawnCount = 0;
    animId = requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', start);

  document.getElementById('surprise-btn').addEventListener('click', function(e){
    e.stopPropagation();
    window.open('https://youtu.be/umMIcZODm2k?si=ZBW_Yrdla6Jrvc4U', '_blank', 'noopener');
  });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      layout();
      start();
    }, 150);
  });

  // wait for the webfont so the very first draw uses correct metrics
  if (document.fonts && document.fonts.ready){
    document.fonts.load("600 16px 'Poppins'").then(start).catch(start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
